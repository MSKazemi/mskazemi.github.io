name: Site checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Identity, claims and consistency
        run: python3 tools/check_site.py
      - name: Sitemap is well-formed XML
        run: python3 -c "import xml.dom.minidom as m; m.parse('sitemap.xml')"
